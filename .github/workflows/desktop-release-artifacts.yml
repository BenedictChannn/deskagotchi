name: Desktop Release Artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            os: windows-latest
            package_script: package:win
            artifact_name: deskagotchi-windows
            artifact_path: |
              release/Deskagotchi Setup *.exe
              release/Deskagotchi Setup *.exe.blockmap
          - platform: macOS
            os: macos-latest
            package_script: package:mac
            artifact_name: deskagotchi-macos
            artifact_path: |
              release/*.dmg
              release/*.zip

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Prepare pnpm
        run: corepack prepare pnpm@11.1.1 --activate

      - name: Set up Python for icon generation
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install icon generation dependency
        run: python -m pip install pillow

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Regenerate committed icon outputs
        run: corepack pnpm run generate:icon

      - name: Validate
        run: corepack pnpm run check

      - name: Package desktop app
        run: corepack pnpm run ${{ matrix.package_script }}

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

  publish-release:
    name: Publish tagged release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download desktop artifacts
        uses: actions/download-artifact@v4
        with:
          path: desktop-artifacts

      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mapfile -t files < <(find desktop-artifacts -type f | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No desktop artifacts found."
            exit 1
          fi

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "${files[@]}" --clobber
          else
            gh release create "$TAG_NAME" "${files[@]}" --verify-tag --generate-notes
          fi
