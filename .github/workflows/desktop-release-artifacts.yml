name: Desktop Release Artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: node -e "const pkg = require('./package.json'); const expected = 'v' + pkg.version; if (process.env.GITHUB_REF_NAME !== expected) { console.error('Tag ' + process.env.GITHUB_REF_NAME + ' does not match package version ' + expected + '.'); process.exit(1); }"

      - name: Validate
        run: pnpm run check

      - name: Package Windows app
        run: pnpm run package:win

      - name: Run Windows release smoke
        run: node scripts/qa/release-qa.mjs

      - name: Generate installer checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem -LiteralPath release -Filter 'Deskagotchi Setup *.exe' | Select-Object -First 1
          if ($null -eq $installer) {
            throw 'No Deskagotchi installer was produced.'
          }
          $hash = Get-FileHash -Algorithm SHA256 -LiteralPath $installer.FullName
          "$($hash.Hash)  $($installer.Name)" | Set-Content -NoNewline -Encoding ascii -LiteralPath "$($installer.FullName).sha256"

      - name: Upload release QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deskagotchi-windows-release-qa
          path: |
            .qa-runs/**/report.md
            .qa-runs/**/summary.json
          if-no-files-found: warn

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: deskagotchi-windows
          path: |
            release/Deskagotchi Setup *.exe
            release/Deskagotchi Setup *.exe.sha256
          if-no-files-found: error

  publish-release:
    name: Publish tagged release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download desktop artifacts
        uses: actions/download-artifact@v4
        with:
          name: deskagotchi-windows
          path: desktop-artifacts

      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mapfile -t files < <(find desktop-artifacts -type f \( -name "*.exe" -o -name "*.sha256" \) | sort)
          if [ "${#files[@]}" -ne 2 ]; then
            echo "Expected exactly one installer and one SHA256 file, found ${#files[@]} files."
            printf '%s\n' "${files[@]}"
            exit 1
          fi

          checksum_file="$(find desktop-artifacts -type f -name "*.sha256" | sort | head -n 1)"
          checksum="$(awk '{print $1}' "$checksum_file")"
          if ! [[ "$checksum" =~ ^[A-Fa-f0-9]{64}$ ]]; then
            echo "Invalid SHA256 in $checksum_file"
            exit 1
          fi

          if ! grep -Fq "Completion status: **complete**" docs/qa/v2-closeout-report.md; then
            echo "Committed closeout report is not complete; run and commit the full release closeout before tagging."
            exit 1
          fi

          notes_source="docs/release-notes/${TAG_NAME}.md"
          if [ ! -f "$notes_source" ]; then
            echo "Missing release notes source: $notes_source"
            exit 1
          fi

          notes_file="$(mktemp)"
          sed "s/{{INSTALLER_SHA256}}/$checksum/g" "$notes_source" > "$notes_file"
          if grep -Eq "Draft|<fill after|\\{\\{INSTALLER_SHA256\\}\\}|Release Evidence To Fill Before Publish|If this build is unsigned|whether the installer was signed" "$notes_file"; then
            echo "Release notes still contain draft or placeholder text."
            exit 1
          fi

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "${files[@]}" --clobber
            gh release edit "$TAG_NAME" --notes-file "$notes_file" --title "Deskagotchi ${TAG_NAME}"
          else
            gh release create "$TAG_NAME" "${files[@]}" --verify-tag --notes-file "$notes_file" --title "Deskagotchi ${TAG_NAME}"
          fi
