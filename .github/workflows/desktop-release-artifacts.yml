name: Desktop Release Artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: node -e "const pkg = require('./package.json'); const expected = 'v' + pkg.version; if (process.env.GITHUB_REF_NAME !== expected) { console.error('Tag ' + process.env.GITHUB_REF_NAME + ' does not match package version ' + expected + '.'); process.exit(1); }"

      - name: Validate
        run: pnpm run check

      - name: Package Windows app
        run: pnpm run package:win

      - name: Run Windows release smoke
        run: node scripts/qa/release-qa.mjs

      - name: Upload release QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deskagotchi-windows-release-qa
          path: |
            .qa-runs/**/report.md
            .qa-runs/**/summary.json
          if-no-files-found: warn

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: deskagotchi-windows
          path: release/Deskagotchi Setup *.exe
          if-no-files-found: error

  publish-release:
    name: Publish tagged release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download desktop artifacts
        uses: actions/download-artifact@v4
        with:
          path: desktop-artifacts

      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mapfile -t files < <(find desktop-artifacts -type f | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No desktop artifacts found."
            exit 1
          fi

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "${files[@]}"
          else
            gh release create "$TAG_NAME" "${files[@]}" --verify-tag --generate-notes
          fi
